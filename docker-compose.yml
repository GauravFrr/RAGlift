version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raglift_api
    ports:
      - "8000:8000"
    environment:
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CHROMA_PATH=/app/data/chroma
      - BM25_INDEX_PATH=/app/data/bm25_index.pkl
      - INGESTION_LOG_PATH=/app/data/ingestion_log.jsonl
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - TOP_K_RETRIEVE=${TOP_K_RETRIEVE:-50}
      - TOP_K_RERANK=${TOP_K_RERANK:-5}
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-50}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
